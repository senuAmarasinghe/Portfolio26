# Continuous Integration: verifies every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0 # Git hooks are for local machines; skip installing them in CI.
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # same Node version as your machine
          cache: npm # reuse downloaded packages between runs

      - name: Install dependencies
        run: npm ci # clean install, exactly as locked in package-lock.json

      - name: Typecheck, lint, format check & tests
        run: npm run check

      - name: Build
        run: npm run build
